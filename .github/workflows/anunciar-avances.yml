name: Anunciar Avances Semanales

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  LlamarSupabaseAvances:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar funcion de avances en Supabase
        run: |
          curl -X POST "https://vdwixgqicpdkyhslmqou.supabase.co/rest/v1/rpc/anunciar_avances_semanales" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json"
