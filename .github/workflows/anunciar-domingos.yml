name: Anunciar Votaciones Domingo

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch:

jobs:
  LlamarSupabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar funcion en Supabase
        run: |
          curl -X POST "https://vdwixgqicpdkyhslmqou.supabase.co/rest/v1/rpc/anunciar_votaciones_discord" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Content-Type: application/json"
