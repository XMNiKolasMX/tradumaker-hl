<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta - TraduMaker HL</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="inicio.css">
    
    <!-- SDK de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .auth-container {
            max-width: 450px;
            margin: 40px auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.7);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .auth-header h2 {
            font-family: 'Cinzel', serif;
            color: white;
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .auth-header p {
            color: #8b949e;
            font-size: 0.9rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #c9d1d9;
            font-size: 0.85rem;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
        }
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }
        .auth-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #8b949e;
        }
        .auth-toggle a {
            color: #818cf8;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-toggle a:hover {
            text-decoration: underline;
        }
        .user-panel {
            text-align: center;
        }
        .user-panel h3 {
            color: white;
            font-family: 'Cinzel', serif;
            margin-bottom: 15px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-logout:hover {
            background: #dc2626;
        }
        .mensaje-alerta {
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
            display: none;
            text-align: center;
        }
        .mensaje-error {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #ef4444;
        }
        .mensaje-exito {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #10b981;
        }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <i class="fa-solid fa-gamepad"></i> TraduMaker<span>HL</span>
            </div>
            <div class="nav-version">
                <a href="index.html" style="color: #a78bfa; text-decoration: none; font-weight: 600;"><i class="fa-solid fa-house"></i> Volver al Inicio</a>
            </div>
        </div>
    </header>

    <main class="main-content" style="padding-top: 120px; padding-bottom: 60px;">
        <div class="container">
            
            <!-- CONTENEDOR PRINCIPAL DE AUTENTICACIÓN -->
            <div class="auth-container" id="contenedorAuth">
                
                <!-- SECCIÓN DE LOGIN / REGISTRO (Se muestra si NO hay sesión) -->
                <div id="seccionFormulario">
                    <div class="auth-header">
                        <h2 id="tituloFormulario">Iniciar Sesión</h2>
                        <p id="subtituloFormulario">Accede a tu cuenta en TraduMaker HL</p>
                    </div>

                    <div id="alertaBox" class="mensaje-alerta"></div>

                    <form id="formAcceso" onsubmit="manejarAcceso(event)">
                        <div class="form-group">
                            <label><i class="fa-solid fa-envelope"></i> Correo Electrónico</label>
                            <input type="email" id="inputEmail" required placeholder="tucorreo@dominio.com">
                        </div>
                        <div class="form-group">
                            <label><i class="fa-solid fa-lock"></i> Contraseña</label>
                            <input type="password" id="inputPassword" required placeholder="••••••••">
                        </div>
                        
                        <!-- ENLACE DE OLVIDÉ MI CONTRASEÑA -->
                        <div id="contenedorOlvido" style="text-align: right; margin-bottom: 15px;">
                            <a href="#" onclick="solicitarRecuperacionPassword(event)" style="font-size: 0.8rem; color: #818cf8; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="btn-submit" id="btnSubmitTexto">Entrar</button>
                    </form>

                    <div class="auth-toggle">
                        <p id="textoToggle">¿No tienes cuenta? <a href="#" onclick="cambiarModoFormulario(event)">Regístrate aquí</a></p>
                    </div>
                </div>

                <!-- SECCIÓN DE PERFIL (Se muestra SI hay sesión iniciada) -->
                <div id="seccionPerfil" class="user-panel" style="display: none;">
                    <div style="font-size: 3rem; color: #a78bfa; margin-bottom: 15px;">
                        <i class="fa-solid fa-circle-user"></i>
                    </div>
                    <h3 id="texto-bienvenida">¡Hola, Usuario!</h3>
                    <p id="texto-email-usuario" style="color: #8b949e; font-size: 0.9rem; margin-bottom: 20px;"></p>
                    <button onclick="cerrarSesion()" class="btn-logout">
                        <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                    </button>
                </div>

            </div>

        </div>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            <p>&copy; 2026 Creado con pasión por el <span>Team HL</span></p>
        </div>
    </footer>

    <script>
        const SUPABASE_URL = 'https://vdwixgqicpdkyhslmqou.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_yJfaiIVchThcK4RADkdmnA_uvsr84h3';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let esModoRegistro = false;

        function cambiarModoFormulario(e) {
            e.preventDefault();
            esModoRegistro = !esModoRegistro;
            
            const titulo = document.getElementById('tituloFormulario');
            const subtitulo = document.getElementById('subtituloFormulario');
            const btn = document.getElementById('btnSubmitTexto');
            const toggle = document.getElementById('textoToggle');
            const contenedorOlvido = document.getElementById('contenedorOlvido');

            if (esModoRegistro) {
                titulo.innerText = 'Crear Cuenta';
                subtitulo.innerText = 'Regístrate para participar en votaciones';
                btn.innerText = 'Registrarse';
                toggle.innerHTML = '¿Ya tienes cuenta? <a href="#" onclick="cambiarModoFormulario(event)">Inicia sesión</a>';
                if (contenedorOlvido) contenedorOlvido.style.display = 'none'; // Ocultar recupero en registro
            } else {
                titulo.innerText = 'Iniciar Sesión';
                subtitulo.innerText = 'Accede a tu cuenta en TraduMaker HL';
                btn.innerText = 'Entrar';
                toggle.innerHTML = '¿No tienes cuenta? <a href="#" onclick="cambiarModoFormulario(event)">Regístrate aquí</a>';
                if (contenedorOlvido) contenedorOlvido.style.display = 'block'; // Mostrar recupero en login
            }
            ocultarAlerta();
        }

        function mostrarAlerta(mensaje, esError = true) {
            const caja = document.getElementById('alertaBox');
            caja.innerText = mensaje;
            caja.className = `mensaje-alerta ${esError ? 'mensaje-error' : 'mensaje-exito'}`;
            caja.style.display = 'block';
        }

        function ocultarAlerta() {
            document.getElementById('alertaBox').style.display = 'none';
        }

        // FUNCIÓN PARA SOLICITAR RECUPERACIÓN DE CONTRASEÑA
        async function solicitarRecuperacionPassword(e) {
            e.preventDefault();
            ocultarAlerta();

            const emailInput = document.getElementById('inputEmail').value.trim();
            if (!emailInput) {
                mostrarAlerta('Por favor, introduce tu correo electrónico arriba para recuperar tu contraseña.');
                return;
            }

            const { data, error } = await supabaseClient.auth.resetPasswordForEmail(emailInput, {
                redirectTo: window.location.href, // Redirige de vuelta a esta misma página o donde desees
            });

            if (error) {
                mostrarAlerta('Error al enviar el correo: ' + error.message);
            } else {
                mostrarAlerta('¡Correo enviado! Revisa tu bandeja de entrada (y spam) para restablecer tu contraseña.', false);
            }
        }

        async function manejarAcceso(event) {
            event.preventDefault();
            ocultarAlerta();

            const email = document.getElementById('inputEmail').value.trim();
            const password = document.getElementById('inputPassword').value;

            // RESTRICCIÓN DE SEGURIDAD PARA EL CORREO ADMIN DESDE LA WEB
            if (esModoRegistro && email.toLowerCase() === 'admin@admin.com') {
                mostrarAlerta('No está permitido registrar este correo desde el formulario público.');
                return;
            }

            if (esModoRegistro) {
                // Obtener la IP antes de registrar
                let ipUsuario = 'desconocida';
                try {
                    const respuestaIp = await fetch('https://api.ipify.org?format=json');
                    const datosIp = await respuestaIp.json();
                    ipUsuario = datosIp.ip;
                } catch (e) {
                    console.warn("No se pudo obtener la IP:", e);
                }

                // Registro en Supabase Auth
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) {
                    mostrarAlerta(error.message);
                } else {
                    // Guardar los datos en la tabla usuarios_registrados con su respectiva IP
                    if (data && data.user) {
                        const { error: errorDb } = await supabaseClient
                            .from('usuarios_registrados')
                            .insert([
                                { 
                                    id: data.user.id, 
                                    email: email, 
                                    rol: 'usuario', 
                                    ip: ipUsuario 
                                }
                            ]);

                        if (errorDb) {
                            console.error("Error al guardar en usuarios_registrados:", errorDb.message);
                        }
                    }

                    mostrarAlerta('¡Cuenta creada con éxito! Ya puedes iniciar sesión.', false);
                    esModoRegistro = false;
                    cambiarModoFormulario(new Event('click'));
                }
            } else {
                // Inicio de sesión
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    mostrarAlerta('Correo o contraseña incorrectos.');
                } else {
                    verificarSesionYSaludar();
                }
            }
        }

        async function verificarSesionYSaludar() {
            const { data: { session }, error } = await supabaseClient.auth.getSession();

            const seccionForm = document.getElementById('seccionFormulario');
            const seccionPerfil = document.getElementById('seccionPerfil');
            const elementoBienvenida = document.getElementById('texto-bienvenida');
            const elementoEmail = document.getElementById('texto-email-usuario');

            if (session && session.user) {
                seccionForm.style.display = 'none';
                seccionPerfil.style.display = 'block';

                const correo = session.user.email;
                elementoEmail.innerText = correo;

                if (correo.toLowerCase() === 'admin@admin.com') {
                    elementoBienvenida.innerHTML = `¡Hola, Administrador! 🛡️`;
                } else {
                    elementoBienvenida.innerHTML = `¡Hola, ${correo}!`;
                }
            } else {
                seccionForm.style.display = 'block';
                seccionPerfil.style.display = 'none';
            }
        }

        async function cerrarSesion() {
            await supabaseClient.auth.signOut();
            document.getElementById('formAcceso').reset();
            verificarSesionYSaludar();
        }

        // Ejecutar al cargar la página para verificar si ya hay sesión activa
        document.addEventListener('DOMContentLoaded', verificarSesionYSaludar);
    </script>
</body>
</html>
